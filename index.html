const Btn=({children,variant="primary",size="md",onClick,full,style={}})=>{
const base={border:"none",borderRadius:8,fontWeight:600,cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",gap:6,transition:"all .15s",width:full?"100%":"auto"};
const sizes={sm:{padding:"6px 14px",fontSize:13},md:{padding:"10px 20px",fontSize:14},lg:{padding:"14px 28px",fontSize:16}};
const variants={primary:{background:C.navy,color:C.white},gold:{background:C.gold,color:C.white},outline:{background:"transparent",color:C.navy,border:`2px solid ${C.navy}`},ghost:{background:"transparent",color:C.gray600},white:{background:C.white,color:C.navy}};
return <button style={{...base,...sizes[size],...variants[variant],...style}} onClick={onClick}>{children}</button>;
};
const Badge=({children,color=C.navy})=>(<span style={{background:color+"18",color,fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:20,display:"inline-flex",alignItems:"center",gap:4}}>{children}</span>);

const Card=({children,onClick,style={}})=>(<div onClick={onClick} style={{background:C.white,borderRadius:12,border:`1px solid ${C.gray200}`,padding:20,cursor:onClick?"pointer":"default",transition:"box-shadow .15s, transform .15s",...style}} onMouseEnter={e=>{if(onClick){e.currentTarget.style.boxShadow="0 4px 20px rgba(0,0,0,.08)";e.currentTarget.style.transform="translateY(-2px)";}}} onMouseLeave={e=>{e.currentTarget.style.boxShadow="none";e.currentTarget.style.transform="none";}}>{children}</div>);
const Input=({icon,...props})=>(<div style={{position:"relative",flex:1}}>{icon&&<span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)"}}><Icon name={icon} size={18} color={C.gray400}/></span>}<input {...props} style={{width:"100%",padding:"12px 16px",paddingLeft:icon?40:16,border:`1px solid ${C.gray200}`,borderRadius:8,fontSize:14,outline:"none",fontFamily:"inherit",...props.style}}/></div>);

</table></Card>}
{tab==="reviews"&&<Card><h3 style={{fontSize:16,fontWeight:700,marginBottom:16,color:C.gray900}}>Flagged Reviews</h3>
{[["Suspicious review","Possible fake — same IP as vendor","Apr 4"],["Inappropriate language","Contains offensive terms","Apr 3"]].map(([title,reason,date],i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 0",borderBottom:`1px solid ${C.gray100}`}}><Icon name="alertCircle" size={20} color={C.red}/><div style={{flex:1}}><div style={{fontWeight:600,fontSize:14,color:C.gray800}}>{title}</div><div style={{fontSize:13,color:C.gray500}}>{reason}</div></div><span style={{fontSize:12,color:C.gray400}}>{date}</span><Btn variant="ghost" size="sm"><Icon name="eye" size={14}/></Btn><Btn variant="ghost" size="sm" style={{color:C.red}}><Icon name="trash2" size={14}/></Btn></div>))}</Card>}
{tab==="categories"&&<Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><h3 style={{fontSize:16,fontWeight:700,color:C.gray900}}>Categories</h3><Btn variant="primary" size="sm"><Icon name="plus" size={14}/> Add</Btn></div>
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(200px, 1fr))",gap:12}}>{CATEGORIES.map(c=>(<div key={c.name} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:C.gray50,borderRadius:8}}><span style={{fontSize:14,color:C.gray700}}>{c.emoji} {c.name}</span><Icon name="edit3" size={14} color={C.gray400} style={{cursor:"pointer"}}/></div>))}</div></Card>}
</div>);};

/* ═══════ SETTINGS ═══════ */
const SettingsPage=({setPage})=>(<div className="fade-in" style={{maxWidth:600,margin:"0 auto",padding:"32px 24px"}}>
<BackBtn setPage={setPage} to="seeker-dashboard" label="Back"/>
<h2 style={{fontSize:22,fontWeight:700,color:C.gray900,marginBottom:24}}>Account Settings</h2>
<Card style={{marginBottom:16}}><h3 style={{fontSize:16,fontWeight:700,marginBottom:16,color:C.gray900}}>Profile</h3>
<div style={{display:"flex",flexDirection:"column",gap:12}}>
<div><label style={{fontSize:13,fontWeight:600,color:C.gray600,marginBottom:4,display:"block"}}>Name</label><Input defaultValue="Samuel"/></div>
<div><label style={{fontSize:13,fontWeight:600,color:C.gray600,marginBottom:4,display:"block"}}>Email</label><Input icon="mail" defaultValue="samuelomiwole@gmail.com"/></div>
<Btn variant="primary" size="sm" style={{alignSelf:"flex-end"}}>Update</Btn>
</div></Card>
<Card style={{marginBottom:16}}><h3 style={{fontSize:16,fontWeight:700,marginBottom:16,color:C.gray900}}>Notifications</h3>
{["New message alerts","New vendors in your city","Monthly newsletter"].map((item,i)=>(<div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:i<2?`1px solid ${C.gray100}`:"none"}}><span style={{fontSize:14,color:C.gray700}}>{item}</span><div style={{width:44,height:24,borderRadius:12,background:i<2?C.navy:C.gray300,cursor:"pointer",position:"relative"}}><div style={{width:20,height:20,borderRadius:"50%",background:C.white,position:"absolute",top:2,left:i<2?22:2}}/></div></div>))}</Card>
<Card><h3 style={{fontSize:16,fontWeight:700,marginBottom:16,color:C.gray900}}>Security</h3><Btn variant="outline" size="sm" full>Change Password</Btn></Card>
</div>);

/* ═══════ REQUEST A SERVICE ═══════ */
const RequestServicePage=({setPage})=>(<div className="fade-in" style={{maxWidth:500,margin:"0 auto",padding:"32px 24px"}}>
<BackBtn setPage={setPage} to="landing" label="Home"/>
<Card>
<h2 style={{fontSize:22,fontWeight:700,color:C.gray900,marginBottom:4}}>Request a Service</h2>
<p style={{color:C.gray500,marginBottom:20,fontSize:14}}>Tell us what you need and we'll notify matching vendors</p>
<div style={{display:"flex",flexDirection:"column",gap:12}}>
<Input placeholder="What service do you need?"/>
<select style={{width:"100%",padding:"12px 16px",border:`1px solid ${C.gray200}`,borderRadius:8,fontSize:14,fontFamily:"inherit",color:C.gray600}}><option>Select Category</option>{CATEGORIES.map(c=><option key={c.name}>{c.name}</option>)}</select>
<Input icon="mapPin" placeholder="Your City"/>
<textarea placeholder="Add details (optional)" style={{width:"100%",padding:12,border:`1px solid ${C.gray200}`,borderRadius:8,fontSize:14,minHeight:80,fontFamily:"inherit",resize:"vertical"}}/>
<Btn variant="primary" size="lg" full onClick={()=>setPage("landing")}>Submit Request</Btn>
</div></Card></div>);

/* ═══════ ROOT ═══════ */
function App(){
const[page,setPage]=useState("landing");
const[isLoggedIn,setLoggedIn]=useState(false);
const[userRole,setUserRole]=useState("seeker");
useEffect(()=>{window.scrollTo({top:0,behavior:"smooth"});},[page]);
const pages={
"landing":<LandingPage setPage={setPage}/>,
"signup":<SignupPage setPage={setPage} setLoggedIn={setLoggedIn} setUserRole={setUserRole}/>,
"login":<LoginPage setPage={setPage} setLoggedIn={setLoggedIn} setUserRole={setUserRole}/>,
"directory":<DirectoryPage setPage={setPage}/>,
"vendor-profile":<VendorProfilePage setPage={setPage}/>,
"seeker-dashboard":<SeekerDashboard setPage={setPage}/>,
"vendor-dashboard":<VendorDashboard setPage={setPage}/>,
"vendor-profile-edit":<VendorProfileEdit setPage={setPage}/>,
"messages":<MessagesPage setPage={setPage}/>,
"admin":<AdminPanel setPage={setPage}/>,
"settings":<SettingsPage setPage={setPage}/>,
"request-service":<RequestServicePage setPage={setPage}/>,
};
return(<div style={{minHeight:"100vh",background:C.gray50,fontFamily:"'Segoe UI', system-ui, -apple-system, sans-serif"}}>
<Navbar setPage={setPage} isLoggedIn={isLoggedIn} userRole={userRole} setLoggedIn={setLoggedIn}/>
{pages[page]||<LandingPage setPage={setPage}/>}
</div>);}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
