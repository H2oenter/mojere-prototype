<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mojere - Immigrant Services Marketplace</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide React Icons from CDN -->
  <script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { Search, Star, MapPin, Phone, Mail, MessageSquare, Heart, ChevronRight, ChevronLeft, Menu, X, User, LogOut, BarChart3, Shield, Clock, CheckCircle, AlertCircle, Settings, Bell, Filter, Globe, Users, Home, Store, FileText, Eye, Trash2, ThumbsUp, Send, ArrowLeft, Plus, Camera, Edit3, TrendingUp, DollarSign, Calendar, ChevronDown } = lucideReact;

    // ── Brand Tokens ──
    const C = {
      green: "#059669", greenLight: "#d1fae5", greenDark: "#047857",
      coral: "#FB7185", coralLight: "#ffe4e6", coralDark: "#e11d48",
      gray50: "#f9fafb", gray100: "#f3f4f6", gray200: "#e5e7eb", gray300: "#d1d5db",
      gray400: "#9ca3af", gray500: "#6b7280", gray600: "#4b5563", gray700: "#374151",
      gray800: "#1f2937", gray900: "#111827",
      white: "#ffffff",
    };

    // ── Mock Data ──
    const CATEGORIES = ["Legal Services", "Healthcare", "Housing", "Education", "Financial", "Food & Grocery", "Hair & Beauty", "Transportation", "IT Services", "Childcare"];
    const LANGUAGES = ["English", "French", "Yoruba", "Mandarin", "Punjabi", "Tagalog", "Arabic", "Spanish", "Portuguese", "Hindi"];

    const VENDORS = [
      { id: 1, name: "Adewale Legal Services", category: "Legal Services", rating: 4.8, reviews: 124, location: "Toronto, ON", languages: ["English", "Yoruba"], image: "🏛️", desc: "Immigration law specialists helping newcomers navigate Canadian legal processes.", verified: true, phone: "+1 416-555-0101", email: "info@adewale.ca", hours: "Mon-Fri 9am-5pm", featured: true },
      { id: 2, name: "Maple Health Clinic", category: "Healthcare", rating: 4.6, reviews: 89, location: "Vancouver, BC", languages: ["English", "Mandarin", "Punjabi"], image: "🏥", desc: "Multilingual healthcare for immigrant families. Walk-ins welcome.", verified: true, phone: "+1 604-555-0202", email: "hello@maplehealth.ca", hours: "Mon-Sat 8am-8pm", featured: true },
      { id: 3, name: "NaijaFoods Market", category: "Food & Grocery", rating: 4.9, reviews: 201, location: "Brampton, ON", languages: ["English", "Yoruba"], image: "🛒", desc: "Authentic West African groceries, spices, and ready-made meals.", verified: true, phone: "+1 905-555-0303", email: "orders@naijafoods.ca", hours: "Daily 7am-10pm", featured: false },
      { id: 4, name: "Priya's Hair Studio", category: "Hair & Beauty", rating: 4.7, reviews: 156, location: "Mississauga, ON", languages: ["English", "Hindi", "Punjabi"], image: "💇", desc: "Specializing in South Asian and Black hair care. Bridal packages available.", verified: true, phone: "+1 905-555-0404", email: "book@priyahair.ca", hours: "Tue-Sun 10am-7pm", featured: false },
      { id: 5, name: "Chen Financial Advisory", category: "Financial", rating: 4.5, reviews: 67, location: "Calgary, AB", languages: ["English", "Mandarin"], image: "💰", desc: "Tax preparation, investment planning, and financial literacy for newcomers.", verified: false, phone: "+1 403-555-0505", email: "info@chenfinance.ca", hours: "Mon-Fri 9am-6pm", featured: false },
      { id: 6, name: "HomeStart Realty", category: "Housing", rating: 4.4, reviews: 45, location: "Ottawa, ON", languages: ["English", "French", "Arabic"], image: "🏠", desc: "Helping immigrants find their first home in Canada. Rental and purchase.", verified: true, phone: "+1 613-555-0606", email: "homes@homestart.ca", hours: "Mon-Sat 9am-7pm", featured: true },
    ];

    const REVIEWS_DATA = [
      { id: 1, vendorId: 1, user: "Maria S.", rating: 5, text: "Adewale helped us with our PR application. Amazing service, very patient with all our questions.", date: "2026-03-28" },
      { id: 2, vendorId: 1, user: "James O.", rating: 5, text: "Best immigration lawyer in Toronto. Speaks Yoruba which made everything easier.", date: "2026-03-20" },
      { id: 3, vendorId: 1, user: "Li W.", rating: 4, text: "Professional and knowledgeable. Office wait times can be long though.", date: "2026-03-15" },
      { id: 4, vendorId: 2, user: "Amir K.", rating: 5, text: "Finally a clinic where I can speak my language. Dr. Chen is wonderful.", date: "2026-03-25" },
      { id: 5, vendorId: 3, user: "Tunde A.", rating: 5, text: "Like shopping back home! Everything fresh and authentic.", date: "2026-03-30" },
    ];

    const MESSAGES = [
      { id: 1, vendorName: "Adewale Legal Services", lastMessage: "Yes, we can schedule your consultation for next Tuesday at 2pm.", time: "2h ago", unread: true },
      { id: 2, vendorName: "HomeStart Realty", lastMessage: "I found 3 properties that match your criteria. When can you view them?", time: "1d ago", unread: false },
      { id: 3, vendorName: "Maple Health Clinic", lastMessage: "Your appointment is confirmed for April 10th.", time: "3d ago", unread: false },
    ];

    // ── Reusable Components ──
    const Btn = ({ children, variant = "primary", size = "md", onClick, full, style = {} }) => {
      const base = { border: "none", borderRadius: 8, fontWeight: 600, cursor: "pointer", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6, transition: "all .15s", width: full ? "100%" : "auto" };
      const sizes = { sm: { padding: "6px 14px", fontSize: 13 }, md: { padding: "10px 20px", fontSize: 14 }, lg: { padding: "14px 28px", fontSize: 16 } };
      const variants = {
        primary: { background: C.green, color: C.white },
        coral: { background: C.coral, color: C.white },
        outline: { background: "transparent", color: C.green, border: `2px solid ${C.green}` },
        ghost: { background: "transparent", color: C.gray600 },
        white: { background: C.white, color: C.green },
      };
      return <button style={{ ...base, ...sizes[size], ...variants[variant], ...style }} onClick={onClick}>{children}</button>;
    };

    const Badge = ({ children, color = C.green }) => (
      <span style={{ background: color + "18", color, fontSize: 11, fontWeight: 600, padding: "3px 10px", borderRadius: 20 }}>{children}</span>
    );

    const StarRating = ({ rating, size = 14 }) => (
      <span style={{ display: "inline-flex", alignItems: "center", gap: 2 }}>
        {[1,2,3,4,5].map(i => <Star key={i} size={size} fill={i <= Math.round(rating) ? "#f59e0b" : "#e5e7eb"} color={i <= Math.round(rating) ? "#f59e0b" : "#e5e7eb"} />)}
        <span style={{ marginLeft: 4, fontSize: size - 1, fontWeight: 600, color: C.gray700 }}>{rating}</span>
      </span>
    );

    const Card = ({ children, onClick, style = {} }) => (
      <div onClick={onClick} style={{ background: C.white, borderRadius: 12, border: `1px solid ${C.gray200}`, padding: 20, cursor: onClick ? "pointer" : "default", transition: "box-shadow .15s, transform .15s", ...style }}
        onMouseEnter={e => { if(onClick){ e.currentTarget.style.boxShadow = "0 4px 20px rgba(0,0,0,.08)"; e.currentTarget.style.transform = "translateY(-2px)"; }}}
        onMouseLeave={e => { e.currentTarget.style.boxShadow = "none"; e.currentTarget.style.transform = "none"; }}>
        {children}
      </div>
    );

    const Input = ({ icon: Icon, ...props }) => (
      <div style={{ position: "relative", flex: 1 }}>
        {Icon && <Icon size={18} color={C.gray400} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)" }} />}
        <input {...props} style={{ width: "100%", padding: "12px 16px", paddingLeft: Icon ? 40 : 16, border: `1px solid ${C.gray200}`, borderRadius: 8, fontSize: 14, outline: "none", ...props.style }} />
      </div>
    );

    const Avatar = ({ emoji, size = 48 }) => (
      <div style={{ width: size, height: size, borderRadius: "50%", background: C.greenLight, display: "flex", alignItems: "center", justifyContent: "center", fontSize: size * 0.5, flexShrink: 0 }}>{emoji}</div>
    );

    const Stat = ({ label, value, icon: Icon, color = C.green }) => (
      <Card style={{ flex: 1, minWidth: 140 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 40, height: 40, borderRadius: 10, background: color + "15", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon size={20} color={color} />
          </div>
          <div>
            <div style={{ fontSize: 22, fontWeight: 700, color: C.gray900 }}>{value}</div>
            <div style={{ fontSize: 12, color: C.gray500 }}>{label}</div>
          </div>
        </div>
      </Card>
    );

    // ── Navigation ──
    const Navbar = ({ currentPage, setPage, isLoggedIn, userRole, setLoggedIn }) => {
      const [menuOpen, setMenuOpen] = useState(false);
      return (
        <nav style={{ background: C.white, borderBottom: `1px solid ${C.gray200}`, padding: "0 24px", position: "sticky", top: 0, zIndex: 100 }}>
          <div style={{ maxWidth: 1200, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", height: 64 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 24 }}>
              <span onClick={() => setPage("landing")} style={{ fontSize: 22, fontWeight: 800, color: C.green, cursor: "pointer", letterSpacing: -0.5 }}>
                mojere<span style={{ color: C.coral }}>.</span>
              </span>
              {isLoggedIn && (
                <div style={{ display: "flex", gap: 4 }}>
                  {userRole === "seeker" && <>
                    <Btn variant="ghost" size="sm" onClick={() => setPage("directory")}>Browse</Btn>
                    <Btn variant="ghost" size="sm" onClick={() => setPage("seeker-dashboard")}>Dashboard</Btn>
                    <Btn variant="ghost" size="sm" onClick={() => setPage("messages")}>Messages</Btn>
                  </>}
                  {userRole === "vendor" && <>
                    <Btn variant="ghost" size="sm" onClick={() => setPage("vendor-dashboard")}>Dashboard</Btn>
                    <Btn variant="ghost" size="sm" onClick={() => setPage("vendor-profile-edit")}>My Profile</Btn>
                    <Btn variant="ghost" size="sm" onClick={() => setPage("messages")}>Inquiries</Btn>
                  </>}
                  {userRole === "admin" && <>
                    <Btn variant="ghost" size="sm" onClick={() => setPage("admin")}>Admin Panel</Btn>
                    <Btn variant="ghost" size="sm" onClick={() => setPage("directory")}>Directory</Btn>
                  </>}
                </div>
              )}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              {!isLoggedIn ? <>
                <Btn variant="ghost" size="sm" onClick={() => setPage("login")}>Log in</Btn>
                <Btn variant="primary" size="sm" onClick={() => setPage("signup")}>Sign up</Btn>
              </> : <>
                <div style={{ position: "relative" }}>
                  <Bell size={20} color={C.gray500} style={{ cursor: "pointer" }} />
                  <div style={{ position: "absolute", top: -2, right: -2, width: 8, height: 8, borderRadius: "50%", background: C.coral }} />
                </div>
                <div onClick={() => setMenuOpen(!menuOpen)} style={{ width: 36, height: 36, borderRadius: "50%", background: C.greenLight, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", fontSize: 16 }}>
                  {userRole === "admin" ? "🛡️" : userRole === "vendor" ? "🏪" : "👤"}
                </div>
                {menuOpen && (
                  <div style={{ position: "absolute", top: 56, right: 24, background: C.white, borderRadius: 12, border: `1px solid ${C.gray200}`, boxShadow: "0 8px 32px rgba(0,0,0,.12)", padding: 8, minWidth: 180, zIndex: 200 }}>
                    <div style={{ padding: "8px 12px", fontSize: 13, color: C.gray500, borderBottom: `1px solid ${C.gray100}`, marginBottom: 4 }}>
                      Signed in as <strong style={{ color: C.gray800 }}>{userRole}</strong>
                    </div>
                    <div onClick={() => { setPage("settings"); setMenuOpen(false); }} style={{ padding: "8px 12px", fontSize: 14, cursor: "pointer", borderRadius: 6, display: "flex", alignItems: "center", gap: 8 }}>
                      <Settings size={16} /> Settings
                    </div>
                    <div onClick={() => { setLoggedIn(false); setPage("landing"); setMenuOpen(false); }} style={{ padding: "8px 12px", fontSize: 14, cursor: "pointer", borderRadius: 6, display: "flex", alignItems: "center", gap: 8, color: C.coral }}>
                      <LogOut size={16} /> Log out
                    </div>
                  </div>
                )}
              </>}
            </div>
          </div>
        </nav>
      );
    };

    // ══════════════════════════════════
    // PAGE: Landing
    // ══════════════════════════════════
    const LandingPage = ({ setPage }) => (
      <div>
        <section style={{ background: `linear-gradient(135deg, ${C.green} 0%, ${C.greenDark} 100%)`, color: C.white, padding: "80px 24px", textAlign: "center" }}>
          <h1 style={{ fontSize: 48, fontWeight: 800, marginBottom: 16, letterSpacing: -1 }}>Find trusted services<br />from your community</h1>
          <p style={{ fontSize: 18, opacity: 0.85, maxWidth: 560, margin: "0 auto 32px" }}>Discover culturally relevant businesses and professionals trusted by immigrants across Canada.</p>
          <div style={{ maxWidth: 640, margin: "0 auto", display: "flex", gap: 8, background: "rgba(255,255,255,.15)", borderRadius: 12, padding: 6 }}>
            <Input icon={Search} placeholder="What service are you looking for?" style={{ border: "none", background: C.white, borderRadius: 8 }} />
            <Input icon={MapPin} placeholder="City" style={{ border: "none", background: C.white, borderRadius: 8, maxWidth: 180 }} />
            <Btn variant="coral" size="md" onClick={() => setPage("directory")}>Search</Btn>
          </div>
          <div style={{ display: "flex", justifyContent: "center", gap: 24, marginTop: 40, flexWrap: "wrap" }}>
            {[["500+", "Verified Vendors"], ["10K+", "Active Users"], ["4.7★", "Avg Rating"], ["50+", "Service Categories"]].map(([n, l]) => (
              <div key={l} style={{ textAlign: "center" }}>
                <div style={{ fontSize: 28, fontWeight: 800 }}>{n}</div>
                <div style={{ fontSize: 13, opacity: 0.7 }}>{l}</div>
              </div>
            ))}
          </div>
        </section>

        <section style={{ maxWidth: 1200, margin: "0 auto", padding: "60px 24px" }}>
          <h2 style={{ fontSize: 28, fontWeight: 700, marginBottom: 8, color: C.gray900 }}>Browse by Category</h2>
          <p style={{ color: C.gray500, marginBottom: 32 }}>Find exactly the type of service you need</p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 12 }}>
            {[["🏛️","Legal"],["🏥","Healthcare"],["🏠","Housing"],["🎓","Education"],["💰","Financial"],["🛒","Food & Grocery"],["💇","Hair & Beauty"],["🚗","Transportation"],["💻","IT Services"],["👶","Childcare"]].map(([emoji, name]) => (
              <Card key={name} onClick={() => setPage("directory")} style={{ textAlign: "center", padding: 20 }}>
                <div style={{ fontSize: 32, marginBottom: 8 }}>{emoji}</div>
                <div style={{ fontSize: 14, fontWeight: 600, color: C.gray700 }}>{name}</div>
              </Card>
            ))}
          </div>
        </section>

        <section style={{ background: C.gray50, padding: "60px 24px" }}>
          <div style={{ maxWidth: 1200, margin: "0 auto" }}>
            <h2 style={{ fontSize: 28, fontWeight: 700, marginBottom: 8, color: C.gray900 }}>Featured Vendors</h2>
            <p style={{ color: C.gray500, marginBottom: 32 }}>Trusted businesses recommended by the community</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(340px, 1fr))", gap: 16 }}>
              {VENDORS.filter(v => v.featured).map(v => (
                <Card key={v.id} onClick={() => setPage("vendor-profile")} style={{ display: "flex", gap: 16 }}>
                  <Avatar emoji={v.image} size={60} />
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <span style={{ fontSize: 16, fontWeight: 700, color: C.gray900 }}>{v.name}</span>
                      {v.verified && <CheckCircle size={14} color={C.green} />}
                    </div>
                    <div style={{ fontSize: 13, color: C.gray500, margin: "2px 0 6px" }}>{v.category} · {v.location}</div>
                    <StarRating rating={v.rating} size={12} />
                    <span style={{ fontSize: 12, color: C.gray400, marginLeft: 6 }}>({v.reviews})</span>
                  </div>
                </Card>
              ))}
            </div>
            <div style={{ textAlign: "center", marginTop: 32 }}>
              <Btn variant="outline" onClick={() => setPage("directory")}>View All Vendors <ChevronRight size={16} /></Btn>
            </div>
          </div>
        </section>

        <section style={{ background: `linear-gradient(135deg, ${C.coral} 0%, ${C.coralDark} 100%)`, color: C.white, padding: "60px 24px", textAlign: "center" }}>
          <h2 style={{ fontSize: 32, fontWeight: 800, marginBottom: 12 }}>Own a business? Join Mojere.</h2>
          <p style={{ fontSize: 16, opacity: 0.85, maxWidth: 480, margin: "0 auto 28px" }}>Get discovered by thousands of immigrants looking for exactly what you offer.</p>
          <Btn variant="white" size="lg" onClick={() => setPage("signup")}>List Your Business Free <ChevronRight size={18} /></Btn>
        </section>

        <footer style={{ background: C.gray900, color: C.gray400, padding: "40px 24px", textAlign: "center", fontSize: 13 }}>
          <span style={{ fontSize: 18, fontWeight: 800, color: C.white }}>mojere<span style={{ color: C.coral }}>.</span></span>
          <p style={{ marginTop: 8 }}>Trusted marketplace for immigrant services in Canada</p>
          <p style={{ marginTop: 16, fontSize: 12 }}>© 2026 Mojere · Privacy · Terms · Contact</p>
        </footer>
      </div>
    );

    // ══════════════════════════════════
    // PAGE: Signup
    // ══════════════════════════════════
    const SignupPage = ({ setPage, setLoggedIn, setUserRole }) => {
      const [role, setRole] = useState(null);
      return (
        <div style={{ minHeight: "80vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.gray50, padding: 24 }}>
          <div style={{ background: C.white, borderRadius: 16, padding: 40, maxWidth: 480, width: "100%", border: `1px solid ${C.gray200}` }}>
            <h2 style={{ fontSize: 24, fontWeight: 700, marginBottom: 4, color: C.gray900 }}>Create your account</h2>
            <p style={{ color: C.gray500, marginBottom: 24 }}>Join thousands of immigrants and vendors on Mojere</p>

            {!role ? (
              <div>
                <p style={{ fontSize: 14, fontWeight: 600, color: C.gray700, marginBottom: 12 }}>I am a...</p>
                <div style={{ display: "flex", gap: 12 }}>
                  <Card onClick={() => setRole("seeker")} style={{ flex: 1, textAlign: "center", padding: 24, border: `2px solid ${C.gray200}`, cursor: "pointer" }}>
                    <div style={{ fontSize: 36, marginBottom: 8 }}>🔍</div>
                    <div style={{ fontWeight: 700, color: C.gray800 }}>Service Seeker</div>
                    <div style={{ fontSize: 12, color: C.gray500, marginTop: 4 }}>Looking for services</div>
                  </Card>
                  <Card onClick={() => setRole("vendor")} style={{ flex: 1, textAlign: "center", padding: 24, border: `2px solid ${C.gray200}`, cursor: "pointer" }}>
                    <div style={{ fontSize: 36, marginBottom: 8 }}>🏪</div>
                    <div style={{ fontWeight: 700, color: C.gray800 }}>Vendor</div>
                    <div style={{ fontSize: 12, color: C.gray500, marginTop: 4 }}>I offer services</div>
                  </Card>
                </div>
              </div>
            ) : (
              <div>
                <Badge color={role === "seeker" ? C.green : C.coral}>{role === "seeker" ? "Service Seeker" : "Vendor"}</Badge>
                <Btn variant="ghost" size="sm" onClick={() => setRole(null)} style={{ marginLeft: 8 }}>Change</Btn>
                <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 20 }}>
                  <Input placeholder="Full Name" />
                  <Input icon={Mail} placeholder="Email address" />
                  {role === "vendor" && <>
                    <Input icon={Store} placeholder="Business Name" />
                    <Input icon={Phone} placeholder="Phone Number" />
                  </>}
                  <Input placeholder="Password" type="password" />
                  <Input placeholder="Confirm Password" type="password" />
                  {role === "vendor" && (
                    <div style={{ fontSize: 13, color: C.gray500 }}>
                      <select style={{ width: "100%", padding: "12px 16px", border: `1px solid ${C.gray200}`, borderRadius: 8, fontSize: 14, color: C.gray600 }}>
                        <option>Select Business Category</option>
                        {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                      </select>
                    </div>
                  )}
                  <Btn variant="primary" size="lg" full onClick={() => { setLoggedIn(true); setUserRole(role); setPage(role === "seeker" ? "directory" : "vendor-dashboard"); }}>
                    {role === "seeker" ? "Create Account" : "Register Business"}
                  </Btn>
                  <p style={{ textAlign: "center", fontSize: 13, color: C.gray500, marginTop: 8 }}>
                    Already have an account? <span style={{ color: C.green, cursor: "pointer", fontWeight: 600 }} onClick={() => setPage("login")}>Log in</span>
                  </p>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // ══════════════════════════════════
    // PAGE: Login
    // ══════════════════════════════════
    const LoginPage = ({ setPage, setLoggedIn, setUserRole }) => {
      const [loginRole, setLoginRole] = useState("seeker");
      return (
        <div style={{ minHeight: "80vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.gray50, padding: 24 }}>
          <div style={{ background: C.white, borderRadius: 16, padding: 40, maxWidth: 420, width: "100%", border: `1px solid ${C.gray200}` }}>
            <h2 style={{ fontSize: 24, fontWeight: 700, marginBottom: 4, color: C.gray900 }}>Welcome back</h2>
            <p style={{ color: C.gray500, marginBottom: 24 }}>Log in to your Mojere account</p>

            <div style={{ display: "flex", gap: 4, background: C.gray100, borderRadius: 8, padding: 4, marginBottom: 20 }}>
              {["seeker", "vendor", "admin"].map(r => (
                <div key={r} onClick={() => setLoginRole(r)} style={{ flex: 1, textAlign: "center", padding: "8px 0", borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: "pointer", background: loginRole === r ? C.white : "transparent", color: loginRole === r ? C.green : C.gray500, boxShadow: loginRole === r ? "0 1px 3px rgba(0,0,0,.1)" : "none" }}>
                  {r.charAt(0).toUpperCase() + r.slice(1)}
                </div>
              ))}
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <Input icon={Mail} placeholder="Email address" />
              <Input placeholder="Password" type="password" />
              <div style={{ textAlign: "right" }}><span style={{ fontSize: 13, color: C.green, cursor: "pointer" }}>Forgot password?</span></div>
              <Btn variant="primary" size="lg" full onClick={() => { setLoggedIn(true); setUserRole(loginRole); setPage(loginRole === "admin" ? "admin" : loginRole === "vendor" ? "vendor-dashboard" : "directory"); }}>
                Log In
              </Btn>
              <div style={{ textAlign: "center", margin: "12px 0", fontSize: 13, color: C.gray400 }}>or</div>
              <Btn variant="outline" size="md" full onClick={() => { setLoggedIn(true); setUserRole(loginRole); setPage("directory"); }}>

                      <td style={{ padding: "12px" }}>
                        <div style={{ display: "flex", gap: 6 }}>
                          <Btn variant="primary" size="sm"><CheckCircle size={14} /> Approve</Btn>
                          <Btn variant="ghost" size="sm" style={{ color: C.coral }}><X size={14} /> Reject</Btn>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </Card>
          )}

          {tab === "reviews" && (
            <Card>
              <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 16, color: C.gray900 }}>Flagged Reviews</h3>
              {[["Suspicious review for Chen Financial", "Possible fake review — same IP as vendor", "Apr 4"], ["Inappropriate language", "Review contains offensive terms", "Apr 3"]].map(([title, reason, date], i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 0", borderBottom: `1px solid ${C.gray100}` }}>
                  <AlertCircle size={20} color={C.coral} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 600, fontSize: 14, color: C.gray800 }}>{title}</div>
                    <div style={{ fontSize: 13, color: C.gray500 }}>{reason}</div>
                  </div>
                  <span style={{ fontSize: 12, color: C.gray400 }}>{date}</span>
                  <Btn variant="ghost" size="sm"><Eye size={14} /> Review</Btn>
                  <Btn variant="ghost" size="sm" style={{ color: C.coral }}><Trash2 size={14} /> Remove</Btn>
                </div>
              ))}
            </Card>
          )}

          {tab === "categories" && (
            <Card>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                <h3 style={{ fontSize: 16, fontWeight: 700, color: C.gray900 }}>Service Categories</h3>
                <Btn variant="primary" size="sm"><Plus size={14} /> Add Category</Btn>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 12 }}>
                {CATEGORIES.map((c, i) => (
                  <div key={c} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 14px", background: C.gray50, borderRadius: 8 }}>
                    <span style={{ fontSize: 14, color: C.gray700 }}>{c}</span>
                    <Edit3 size={14} color={C.gray400} style={{ cursor: "pointer" }} />
                  </div>
                ))}
              </div>
            </Card>
          )}
        </div>
      );
    };

    // ══════════════════════════════════
    // PAGE: Settings
    // ══════════════════════════════════
    const SettingsPage = ({ setPage }) => (
      <div style={{ maxWidth: 600, margin: "0 auto", padding: "32px 24px" }}>
        <Btn variant="ghost" size="sm" onClick={() => setPage("seeker-dashboard")} style={{ marginBottom: 16 }}><ArrowLeft size={16} /> Back</Btn>
        <h2 style={{ fontSize: 24, fontWeight: 700, color: C.gray900, marginBottom: 24 }}>Account Settings</h2>
        <Card style={{ marginBottom: 16 }}>
          <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 16, color: C.gray900 }}>Profile</h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div><label style={{ fontSize: 13, fontWeight: 600, color: C.gray600, marginBottom: 4, display: "block" }}>Name</label><Input value="Samuel" /></div>
            <div><label style={{ fontSize: 13, fontWeight: 600, color: C.gray600, marginBottom: 4, display: "block" }}>Email</label><Input icon={Mail} value="samuelomiwole@gmail.com" /></div>
            <Btn variant="primary" size="sm" style={{ alignSelf: "flex-end" }}>Update Profile</Btn>
          </div>
        </Card>
        <Card style={{ marginBottom: 16 }}>
          <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 16, color: C.gray900 }}>Notifications</h3>
          {["Email notifications for new messages", "Email digest of new vendors", "Review response alerts"].map((item, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 0", borderBottom: i < 2 ? `1px solid ${C.gray100}` : "none" }}>
              <span style={{ fontSize: 14, color: C.gray700 }}>{item}</span>
              <div style={{ width: 44, height: 24, borderRadius: 12, background: i === 0 ? C.green : C.gray300, cursor: "pointer", position: "relative" }}>
                <div style={{ width: 20, height: 20, borderRadius: "50%", background: C.white, position: "absolute", top: 2, left: i === 0 ? 22 : 2, transition: "left .2s" }} />
              </div>
            </div>
          ))}
        </Card>
        <Card>
          <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 16, color: C.gray900 }}>Security</h3>
          <Btn variant="outline" size="sm" full>Change Password</Btn>
        </Card>
      </div>
    );

    // ══════════════════════════════════
    // ROOT APP
    // ══════════════════════════════════
    function App() {
      const [page, setPage] = useState("landing");
      const [isLoggedIn, setLoggedIn] = useState(false);
      const [userRole, setUserRole] = useState("seeker");

      useEffect(() => { window.scrollTo({ top: 0, behavior: "smooth" }); }, [page]);

      const pages = {
        "landing": <LandingPage setPage={setPage} />,
        "signup": <SignupPage setPage={setPage} setLoggedIn={setLoggedIn} setUserRole={setUserRole} />,
        "login": <LoginPage setPage={setPage} setLoggedIn={setLoggedIn} setUserRole={setUserRole} />,
        "directory": <DirectoryPage setPage={setPage} />,
        "vendor-profile": <VendorProfilePage setPage={setPage} />,
        "seeker-dashboard": <SeekerDashboard setPage={setPage} />,
        "vendor-dashboard": <VendorDashboard setPage={setPage} />,
        "vendor-profile-edit": <VendorProfileEdit setPage={setPage} />,
        "messages": <MessagesPage setPage={setPage} />,
        "admin": <AdminPanel setPage={setPage} />,
        "settings": <SettingsPage setPage={setPage} />,
      };

      return (
        <div style={{ minHeight: "100vh", background: C.gray50, fontFamily: "'Segoe UI', system-ui, -apple-system, sans-serif" }}>
          <Navbar currentPage={page} setPage={setPage} isLoggedIn={isLoggedIn} userRole={userRole} setLoggedIn={setLoggedIn} />
          {pages[page] || <LandingPage setPage={setPage} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
